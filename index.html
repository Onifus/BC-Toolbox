<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rozcestník snippet nástrojů</title>
  <meta name="description" content="Úvodní stránka – rozcestník mezi generátory snippetů" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0b0f14; /* dark base */
      --panel: #111826;
      --muted: #9aa4b2;
      --text: #e6edf6;
      --ring: #3b82f6;
      --card-1: linear-gradient(135deg, #1f2937, #0ea5e9);
      --card-2: linear-gradient(135deg, #1f2937, #22c55e);
      --card-3: linear-gradient(135deg, #1f2937, #a855f7);
      --card-4: linear-gradient(135deg, #1f2937, #f59e0b);
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f6f7fb; --panel:#ffffff; --muted:#51606f; --text:#0b1220; --ring:#2563eb;
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial; background:radial-gradient(1200px 600px at 20% -10%, #1b2433 10%, transparent), radial-gradient(900px 400px at 120% 10%, #1a2a43 10%, transparent), var(--bg); color:var(--text);
    }
    .container{max-width:1100px; margin:0 auto; padding:24px}
    header{
      display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 20px; border-radius:20px; background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,0.08);
    }
    .brand{display:flex; gap:14px; align-items:center}
    .logo{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:conic-gradient(from 90deg at 50% 50%, #3b82f6, #22c55e, #a855f7, #f59e0b, #3b82f6)}
    .logo span{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
    h1{font-size:clamp(20px, 2.7vw, 32px); margin:0}
    .subtitle{color:var(--muted); margin-top:4px; font-size:14px}

    .controls{display:flex; gap:12px; align-items:center}
    .search{position:relative}
    .search input{
      width:260px; max-width:50vw; padding:10px 12px 10px 36px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:var(--panel); color:var(--text); outline:none;
    }
    .search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.6}
    .btn{padding:10px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.14); background:var(--panel); color:var(--text); cursor:pointer}
    .btn:focus, .search input:focus{box-shadow:0 0 0 3px color-mix(in oklab, var(--ring) 35%, transparent)}

    main{margin-top:24px}
    .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px}
    @media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:560px){.grid{grid-template-columns:1fr}}

    .card{
      position:relative; overflow:hidden; border-radius:18px; padding:18px; background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.10); transition:transform .15s ease, box-shadow .2s ease;
    }
    .card::before{content:""; position:absolute; inset:0; background:var(--bg-layer, var(--card-1)); opacity:.25;}
    .card:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .card-inner{position:relative}
    .card h3{margin:6px 0 6px; font-size:18px}
    .card p{margin:0; color:var(--muted); font-size:14px; min-height:40px}
    .chip{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.10); font-size:12px}
    .open{margin-top:12px; display:inline-flex; align-items:center; gap:8px; text-decoration:none; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); color:var(--text)}
    .kbd{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; padding:2px 6px; border-radius:6px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08)}

    footer{margin:26px 8px; color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:space-between}
    .theme-toggle{display:inline-flex; align-items:center; gap:8px}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"><span>⚡️</span></div>
        <div>
          <h1>Rozcestník snippetů</h1>
          <div class="subtitle">Rychlý přístup ke všem 4 generátorům • filtr podle názvu</div>
        </div>
      </div>
      <div class="controls">
        <div class="search" role="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 21l-3.5-3.5M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="1.5"/></svg>
          <input id="search" type="search" placeholder="Hledat… (/)" aria-label="Hledat podle názvu" />
        </div>
        <button id="themeBtn" class="btn theme-toggle" aria-pressed="false" aria-label="Přepnout téma">
          <span id="themeIcon" aria-hidden="true">🌙</span>
          <span class="sr-only">Přepnout téma</span>
        </button>
      </div>
    </header>

    <main>
      <div id="grid" class="grid" aria-live="polite"></div>
    </main>

    <footer>
      <div>
        Tip: otevři kartou <span class="kbd">1</span>–<span class="kbd">4</span> • Fokus vyhledávání <span class="kbd">/</span>
      </div>
      <div id="meta"></div>
    </footer>
  </div>

  <script>
    // === KONFIGURACE KARET ====================================================
    // Doplň URL a popisy tvých čtyř stránek. Tituly se používají pro hledání.
    const APPS = [
      { key: 'snp1', title: 'Začátečník/Pokročilý', desc: 'Snipped s tlačítky začátečník a pokročilý', url: 'basic_advance.html', accent: 'var(--card-1)', icon: '🧩' },
      { key: 'snp2', title: 'HTML/CSS/JS', desc: 'Snipped s okny pro HTML,JS A CSS', url: 'js-html-css.html', accent: 'var(--card-2)', icon: '⚙️' },
      { key: 'snp3', title: 'Solo snipped', desc: 'Slouží pro vygenerovaní jednoho snippetu ve vybraném jazyce', url: 'single_snipped.html', accent: 'var(--card-3)', icon: '🧪' },
      { key: 'snp4', title: 'Hypertextovy kod', desc: 'Označ kod, a nastav, kam bude daná část odkazovat', url: 'snipped_hypertext.html', accent: 'var(--card-4)', icon: '🚀' },
      { key: 'snp4', title: 'Preview kodů', desc: 'Označ kod, a nastav, kam bude daná část odkazovat', url: 'jazyky.html', accent: 'var(--card-4)', icon: '🚀' },
     
    ];

    // === RENDER ===============================================================
    const grid = document.getElementById('grid');
    const meta = document.getElementById('meta');

    function cardTemplate(app, idx){
      return `
        <article class="card" style="--bg-layer:${app.accent}" tabindex="0" aria-labelledby="h3-${app.key}">
          <div class="card-inner">
            <span class="chip" aria-hidden="true">${app.icon} Nástroj ${idx+1}</span>
            <h3 id="h3-${app.key}">${app.title}</h3>
            <p>${app.desc}</p>
            <a class="open" href="${app.url}" data-idx="${idx}" rel="noopener">Otevřít <span class="kbd">${idx+1}</span></a>
          </div>
        </article>
      `;
    }

    function render(list){
      grid.innerHTML = list.map(cardTemplate).join('');
      meta.textContent = `${list.length} z ${APPS.length} zobrazeno • ${new Date().toLocaleDateString('cs-CZ')}`;
    }

    render(APPS);

    // === HLEDÁNÍ ==============================================================
    const input = document.getElementById('search');
    const filter = () => {
      const q = input.value.trim().toLowerCase();
      const filtered = APPS.filter(a => a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q));
      render(filtered);
    };
    input.addEventListener('input', filter);

    // Klávesové zkratky: / fokus na hledání, 1-4 otevře kartu, Enter na focused kartu
    window.addEventListener('keydown', (e) => {
      if(e.key === '/'){
        e.preventDefault(); input.focus(); input.select(); return;
      }
      if(/^[1-4]$/.test(e.key)){
        const idx = Number(e.key) - 1;
        const a = document.querySelector(`a.open[data-idx="${idx}"]`);
        if(a){ a.click(); }
      }
      if(e.key === 'Enter' && document.activeElement?.classList.contains('card')){
        const i = [...document.querySelectorAll('.card')].indexOf(document.activeElement);
        const a = document.querySelector(`a.open[data-idx="${i}"]`);
        if(a){ a.click(); }
      }
    });

    // === TÉMA (dark/light) ====================================================
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const THEMES = { light: 'light', dark: 'dark' };

    function applyTheme(t){
      document.documentElement.dataset.theme = t;
      if(t === THEMES.light){
        themeIcon.textContent = '🌞';
      } else {
        themeIcon.textContent = '🌙';
      }
      localStorage.setItem('hub-theme', t);
    }

    function getSystemTheme(){
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? THEMES.light : THEMES.dark;
    }

    applyTheme(localStorage.getItem('hub-theme') || getSystemTheme());

    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.dataset.theme || THEMES.dark;
      applyTheme(cur === THEMES.dark ? THEMES.light : THEMES.dark);
      themeBtn.setAttribute('aria-pressed', String(cur === THEMES.dark));
    });
  </script>
</body>
</html>
